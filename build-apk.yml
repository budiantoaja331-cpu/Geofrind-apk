name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Memungkinkan Anda menekan tombol "Run workflow" secara manual
  workflow_dispatch:

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      # --- 1. DECODE GOOGLE SERVICES (DARI BASE64) ---
      - name: Decode dan Inject Google Services JSON
        env:
          JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$JSON_BASE64" | base64 --decode > app/google-services.json

      # --- 2. INJECT GEMINI API KEY (JIKA ADA) ---
      - name: Inject API Keys to local.properties
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_KEY" > local.properties

      # --- 3. PROSES BUILD APK ---
      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease

      # --- 4. UPLOAD APK AGAR BISA ANDA DOWNLOAD ---
      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
