name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Decode Google Services JSON using Base64
      - name: Decode dan Inject Google Services JSON
        env:
          JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$JSON_BASE64" | base64 --decode > app/google-services.json

      # Inject API Keys into local.properties
      - name: Inject API Keys to local.properties
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_KEY" > local.properties

      # Decode the Keystore file from GitHub Secrets
      - name: Decode Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Creates the keystore file in the app/ folder
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.keystore

      # Explicit step to remove corrupted Gradle cache before building
      - name: Clean Gradle Cache
        run: |
          echo "Removing ~/.gradle/caches/ to prevent Jar creation exceptions..."
          rm -rf ~/.gradle/caches/

      # Make gradlew executable (prevents permission denied errors)
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # Build the APK using ./gradlew as requested, with signing variables
      - name: Build Release APK
        env:
          # These environment variables must match how your build.gradle.kts reads them
          KEYSTORE_PATH: "release-key.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Upload the finished APK
      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
