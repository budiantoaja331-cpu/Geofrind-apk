name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- PERBAIKAN 1: KEMBALI KE JAVA 17 (Wajib untuk pustaka terbaru) ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # --- 2. MEMASUKKAN FIREBASE JSON ---
      - name: Inject Google Services JSON
        env:
          JSON_DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          cat <<EOF > app/google-services.json
          $JSON_DATA
          EOF

      # --- 3. MEMASUKKAN GEMINI API KEY ---
      - name: Inject API Keys to local.properties
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_KEY" > local.properties

      # --- PERBAIKAN 2: GUNAKAN GRADLE 8.5 & BERSIHKAN CACHE ---
      # Kita gunakan Gradle 8.5 yang lebih tahan banting terhadap error ekstrak JAR,
      # dan kita tambahkan 'clean' serta '--no-configuration-cache' agar
      # proses build benar-benar mengunduh ulang file yang korup.
      - name: Build Unsigned Release APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          arguments: clean assembleRelease --no-daemon --no-configuration-cache

      # --- 5. UPLOAD APK KE HALAMAN GITHUB ACTIONS ---
      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
