name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # --- 1. MEMASUKKAN FIREBASE JSON (TANPA BASE64) ---
      - name: Inject Google Services JSON (Tanpa Base64)
        env:
          JSON_DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          cat <<EOF > app/google-services.json
          $JSON_DATA
          EOF

      # --- 2. MEMASUKKAN GEMINI API KEY ---
      - name: Inject API Keys to local.properties
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_KEY" > local.properties

      # --- 3. BUILD APK (MEMPERBAIKI ERROR ./gradlew) ---
      - name: Build Unsigned Release APK
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleRelease

      # --- 4. UPLOAD APK AGAR BISA DIDOWNLOAD ---
      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
