name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- PERBAIKAN 1: TURUNKAN VERSI JAVA KE 11 ---
      # Seringkali, proyek Gradle lama lebih stabil menggunakan Java 11
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11' 
          distribution: 'temurin'

      # --- 1. MEMASUKKAN FIREBASE JSON ---
      - name: Inject Google Services JSON
        env:
          JSON_DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          cat <<EOF > app/google-services.json
          $JSON_DATA
          EOF

      # --- 2. MEMASUKKAN GEMINI API KEY ---
      - name: Inject API Keys to local.properties
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_KEY" > local.properties

      # --- PERBAIKAN 2: BERSIHKAN CACHE & JALANKAN BUILD ---
      # Kita tambahkan argumen --no-daemon dan argumen pembersih cache
      # agar error "Gagal membuat file Jar" tidak terulang
      - name: Build Unsigned Release APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2' 
          arguments: clean assembleRelease --no-daemon

      # --- 4. UPLOAD APK KE HALAMAN GITHUB ACTIONS ---
      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
